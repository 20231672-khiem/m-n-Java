<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Bài 8 - Đăng nhập hệ thống JSF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 mt-5">
                    <!-- Header màu xanh chuẩn hệ thống quản lý -->
                    <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">
                        <h3 class="mb-0">Đăng Nhập Hệ Thống (Bài 8)</h3>
                        <p class="mb-0 text-white-50 small mt-1">Vui lòng đăng nhập để truy cập trang chủ</p>
                    </div>
                    <div class="card-body p-4">
                        <h:form>
                            <!-- Hiển thị FacesMessage nếu đăng nhập sai tài khoản -->
                            <h:messages globalOnly="true" class="alert alert-danger p-2 small list-unstyled text-center" />

                            <div class="mb-3">
                                <label class="form-label fw-bold">Tài khoản (admin):</label>
                                <h:inputText id="user" value="#{loginBean.username}" required="true" requiredMessage="Chưa nhập tài khoản" class="form-control" />
                                <h:message for="user" class="text-danger small" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu (123456):</label>
                                <h:inputSecret id="pass" value="#{loginBean.password}" required="true" requiredMessage="Chưa nhập mật khẩu" class="form-control" />
                                <h:message for="pass" class="text-danger small" />
                            </div>

                            <!-- Nút đăng nhập: Đúng vào index.xhtml, sai đứng yên hiện lỗi -->
                            <div class="d-grid mt-4">
                                <h:commandButton value="Đăng Nhập Ngay" action="#{loginBean.login}" class="btn btn-primary btn-lg" />
                            </div>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
