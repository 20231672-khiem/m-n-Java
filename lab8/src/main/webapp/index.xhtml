<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Lab 8 - JSF</title>
    <!-- Nhúng CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Lab 8 - Chuyển form sang JSF, validation và message</h3>
            </div>
            <div class="card-body">
                <div class="d-grid gap-3 col-md-6 mx-auto">
                    <h:link outcome="sinhvien-form" value="Mở form thêm sinh viên" class="btn btn-outline-primary btn-lg" />
                    <h:link outcome="sinhvien-list" value="Xem danh sách sinh viên" class="btn btn-outline-success btn-lg" />
                    <h:link outcome="sach-form" value="Mở form thêm sách" class="btn btn-outline-info btn-lg mt-3" />
                    <h:link outcome="sach-list" value="Xem danh sách sách" class="btn btn-outline-warning btn-lg" />
                    <h:link outcome="sanpham-form" value="Mở form nhập sản phẩm" class="btn btn-outline-dark btn-lg mt-3" />
                    <h:link outcome="sanpham-list" value="Xem kho sản phẩm" class="btn btn-outline-secondary btn-lg" />
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
