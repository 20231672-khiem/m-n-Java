<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Thêm Sách Mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Thêm Sách Mới</h4>
                    </div>
                    <div class="card-body">
                        <h:form>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên Sách:</label>
                                <h:inputText id="tenSach" value="#{sachBean.sach.tenSach}" class="form-control" />
                                <h:message for="tenSach" class="text-danger small" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tác Giả:</label>
                                <h:inputText id="tacGia" value="#{sachBean.sach.tacGia}" class="form-control" />
                                <h:message for="tacGia" class="text-danger small" />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Năm Xuất Bản:</label>
                                <h:inputText id="nam" value="#{sachBean.sach.namXuatBan}" class="form-control" />
                                <h:message for="nam" class="text-danger small" />
                            </div>

                            <div class="d-grid mt-4">
                                <h:commandButton value="Lưu thông tin" action="#{sachBean.save}" class="btn btn-success" />
                            </div>
                        </h:form>
                    </div>
                    <div class="card-footer text-center bg-white">
                        <h:link outcome="sach-list" value="Xem danh sách" class="text-decoration-none text-success" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
