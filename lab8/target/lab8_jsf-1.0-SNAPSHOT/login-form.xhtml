<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Đăng Nhập Hệ Thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center">
                        <h4 class="mb-0">Đăng Nhập Hệ Thống JSF</h4>
                    </div>
                    <div class="card-body p-4">
                        <h:form>
                            <!-- Thông báo lỗi -->
                            <div class="mb-3 text-center">
                                <h:outputText value="#{loginBean.message}" class="text-danger fw-bold" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Tên đăng nhập (admin):</label>
                                <h:inputText id="user" value="#{loginBean.username}" required="true" requiredMessage="Chưa nhập tên đăng nhập" class="form-control" />
                                <h:message for="user" class="text-danger small" />
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Mật khẩu (123456):</label>
                                <h:inputSecret id="pass" value="#{loginBean.password}" required="true" requiredMessage="Chưa nhập mật khẩu" class="form-control" />
                                <h:message for="pass" class="text-danger small" />
                            </div>

                            <div class="d-grid mt-4">
                                <h:commandButton value="Đăng Nhập" action="#{loginBean.login}" class="btn btn-dark btn-lg" />
                            </div>
                        </h:form>
                    </div>
                    <div class="card-footer text-center bg-white py-3">
                        <h:link outcome="index" value="Về trang chủ" class="text-decoration-none text-muted" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</h:body>
</html>
