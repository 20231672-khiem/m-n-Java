<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Trang Quản Trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-light">
    <div class="container mt-5 text-center">
        <div class="card shadow p-5 col-md-6 mx-auto">
            <h2 class="text-success mb-3">Xin chào, #{loginBean.username}!</h2>
            <p class="lead">Bạn đã đăng nhập vào hệ thống quản lý Lab 8 thành công.</p>
            <hr class="my-4"/>
            <h:form>
                <h:commandButton value="Đăng Xuất" action="#{loginBean.logout}" class="btn btn-outline-danger btn-lg" />
                <h:link outcome="index" value="Về trang chủ" class="btn btn-secondary btn-lg ms-3" />
            </h:form>
        </div>
    </div>
</h:body>
</html>
