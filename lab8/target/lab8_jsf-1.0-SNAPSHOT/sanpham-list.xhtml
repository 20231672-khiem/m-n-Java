<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Kho Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>
<h:body class="bg-dark text-light">
    <div class="container mt-5">
        <h2 class="text-center text-warning mb-4">Quản Lý Kho Sản Phẩm</h2>

        <h:form>
            <div class="table-responsive rounded">
                <h:dataTable value="#{sanPhamBean.dsSanPham}" var="sp" class="table table-dark table-striped table-hover mb-0">
                    <h:column><f:facet name="header">ID</f:facet>#{sp.id}</h:column>
                    <h:column><f:facet name="header">Tên Sản Phẩm</f:facet>#{sp.tenSanPham}</h:column>
                    <h:column><f:facet name="header">Đơn Giá</f:facet>
                        <h:outputText value="#{sp.gia}">
                            <f:convertNumber pattern="#,### ₫" />
                        </h:outputText>
                    </h:column>
                    <h:column><f:facet name="header">Số Lượng</f:facet>
                        <span class="badge bg-danger">#{sp.soLuong}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Thao tác</f:facet>
                        <h:commandButton value="Xóa" action="#{sanPhamBean.delete(sp.id)}" class="btn btn-outline-danger btn-sm" />
                    </h:column>
                </h:dataTable>
            </div>
        </h:form>

        <div class="mt-4 text-center">
            <h:link outcome="sanpham-form" value="Nhập hàng mới" class="btn btn-warning text-dark fw-bold" />
            <h:link outcome="index" value="Về trang chủ" class="btn btn-secondary ms-2" />
        </div>
    </div>
</h:body>
</html>
